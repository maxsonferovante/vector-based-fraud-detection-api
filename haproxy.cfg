global
    maxconn 8192
    nbthread 1
    # Limita o uso de memória do HAProxy
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode http
    no log
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    maxconn 10000

frontend http_in
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    # Health check no endpoint /ready
    option httpchk GET /ready
    http-check expect status 200
    
    server api1 api1:9999 check init-addr last,libc,none
    server api2 api2:9999 check init-addr last,libc,none
