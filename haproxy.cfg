global
    maxconn 4096
    nbthread 1
    # Tuning de memória ultra-baixo (apenas 14 MB alocado para o LB)
    tune.bufsize 4096
    tune.maxrewrite 512

defaults
    mode http
    no log
    timeout connect 3s
    timeout client  10s
    timeout server  10s
    # maxconn por frontend/backend — aumentado de 1024 para comportar picos de carga do k6
    maxconn 4096

frontend http_in
    bind *:9999
    # Só libera as requisições quando pelo menos UMA instância estiver pronta
    acl any_ready nbsrv(api_servers) ge 1
    http-request deny deny_status 503 unless any_ready

    default_backend api_servers

backend api_servers
    balance roundrobin
    # Health check no endpoint /ready
    option httpchk GET /ready
    http-check expect status 200
    # inter: intervalo entre checks | rise: checks OK para marcar UP | fall: checks KO para marcar DOWN
    server api1 api1:9999 check inter 500ms rise 1 fall 2 init-addr last,libc,none
    server api2 api2:9999 check inter 500ms rise 1 fall 2 init-addr last,libc,none
