global
    maxconn 1024
    nbthread 1
    # Buffer reduzido para 2KB para caber no Cache L1 (payloads JSON são minúsculos).
    tune.bufsize 2048
    # Desabilita splice para evitar overhead de pipes em dados pequenos.
    nosplice

defaults
    mode http
    no log
    timeout connect 3s
    timeout client  10s
    timeout server  10s
    maxconn 1024
    
    # Otimizações de handshake TCP
    option tcp-smart-accept
    option tcp-smart-connect
    option dontlognull

frontend http_in
    # defer-accept: O kernel só avisa o HAProxy quando houver dados (economiza syscalls).
    bind *:9999 defer-accept
    
    acl any_ready nbsrv(api_servers) ge 1
    http-request deny deny_status 503 unless any_ready
    default_backend api_servers

backend api_servers
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    
    # Redução da frequência de healthchecks para poupar CPU.
    # 'fastinter' garante que o serviço suba rápido no início.
    server api1 api1:9999 check inter 2000ms fastinter 250ms rise 1 fall 2 init-addr last,libc,none
    server api2 api2:9999 check inter 2000ms fastinter 250ms rise 1 fall 2 init-addr last,libc,none
